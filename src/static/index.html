<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mood Detector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: 'Segoe UI', sans-serif;
      color: #f0f0f0;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #ffffff;
    }

    p.subtitle {
      font-size: 0.875rem;
      color: #666;
      margin-bottom: 28px;
    }

    .upload-area {
      border: 2px dashed #333;
      border-radius: 12px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    .upload-area:hover, .upload-area.dragover {
      border-color: #6366f1;
      background: #1e1e2e;
    }

    .upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon { font-size: 2.5rem; margin-bottom: 10px; }

    .upload-area p {
      font-size: 0.875rem;
      color: #888;
    }

    #preview {
      margin-top: 20px;
      display: none;
      text-align: center;
    }

    #preview img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid #2a2a2a;
    }

    button#analyzeBtn {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    button#analyzeBtn:hover { background: #4f46e5; }
    button#analyzeBtn:disabled { opacity: 0.5; cursor: not-allowed; }

    #result {
      margin-top: 24px;
      display: none;
    }

    .emotion-badge {
      display: inline-block;
      font-size: 2rem;
      font-weight: 700;
      color: #a5b4fc;
      margin-bottom: 4px;
    }

    .confidence {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 20px;
    }

    .prob-bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #999;
      margin-bottom: 4px;
    }

    .prob-bar-track {
      background: #2a2a2a;
      border-radius: 6px;
      height: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .prob-bar-fill {
      height: 100%;
      border-radius: 6px;
      background: #6366f1;
      transition: width 0.6s ease;
    }

    .error-msg {
      margin-top: 16px;
      padding: 12px 16px;
      background: #2a1a1a;
      border: 1px solid #5a2a2a;
      border-radius: 8px;
      color: #f87171;
      font-size: 0.875rem;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Mood Detector</h1>
    <p class="subtitle">Upload a face photo — get an emotion prediction.</p>

    <div class="upload-area" id="uploadArea">
      <input type="file" id="fileInput" accept="image/jpeg,image/png" />
      <div class="upload-icon">🖼️</div>
      <p>Click or drag & drop a JPEG / PNG</p>
    </div>

    <div id="preview">
      <img id="previewImg" src="" alt="Preview" />
    </div>

    <button id="analyzeBtn" disabled>Analyze</button>

    <div id="result"></div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const uploadArea = document.getElementById('uploadArea');
    const preview = document.getElementById('preview');
    const previewImg = document.getElementById('previewImg');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const resultDiv = document.getElementById('result');

    let selectedFile = null;

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      selectedFile = file;
      previewImg.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      analyzeBtn.disabled = false;
      resultDiv.style.display = 'none';
      resultDiv.innerHTML = '';
    });

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (!file) return;
      selectedFile = file;
      previewImg.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      analyzeBtn.disabled = false;
      resultDiv.style.display = 'none';
      resultDiv.innerHTML = '';
    });

    const EMOTION_EMOJI = { Angry: '😠', Happy: '😄', Sad: '😢' };

    analyzeBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      analyzeBtn.disabled = true;
      analyzeBtn.innerHTML = '<span class="spinner"></span>Analyzing...';
      resultDiv.style.display = 'none';
      resultDiv.innerHTML = '';

      const formData = new FormData();
      formData.append('file', selectedFile);

      try {
        const response = await fetch('/predict', {
          method: 'POST',
          body: formData,
        });

        const data = await response.json();

        if (!response.ok) {
          resultDiv.innerHTML = `<div class="error-msg">⚠️ ${data.detail || 'Something went wrong.'}</div>`;
        } else if (!data.emotion) {
          resultDiv.innerHTML = `<div class="error-msg">⚠️ ${data.message}</div>`;
        } else {
          const emoji = EMOTION_EMOJI[data.emotion] || '🤔';
          const bars = Object.entries(data.probabilities)
            .map(([label, pct]) => `
              <div class="prob-bar-label">
                <span>${EMOTION_EMOJI[label] || ''} ${label}</span>
                <span>${pct}%</span>
              </div>
              <div class="prob-bar-track">
                <div class="prob-bar-fill" style="width: ${pct}%"></div>
              </div>
            `).join('');

          resultDiv.innerHTML = `
            <div class="emotion-badge">${emoji} ${data.emotion}</div>
            <div class="confidence">Confidence: ${data.confidence}</div>
            ${bars}
          `;
        }

        resultDiv.style.display = 'block';
      } catch (err) {
        resultDiv.innerHTML = `<div class="error-msg">⚠️ Could not reach the API. Is the server running?</div>`;
        resultDiv.style.display = 'block';
      } finally {
        analyzeBtn.disabled = false;
        analyzeBtn.innerHTML = 'Analyze';
      }
    });
  </script>
</body>
</html>
